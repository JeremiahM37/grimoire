# Release builds. `git tag vX.Y.Z && git push --tags` is the whole trigger; the
# workflow in .github/workflows/release.yml runs this.
#
# Two binaries ship, not one: the server/CLI and the MCP server an agent
# launches. Both are static (pure-Go SQLite, CGO off), so a release is a file
# you download and run — no runtime, no virtualenv, no package manager.
version: 2

project_name: grimoire

before:
  hooks:
    - go -C go mod tidy

builds:
  - id: grimoire
    dir: go
    main: ./cmd/grimoire
    binary: grimoire
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/JeremiahM37/grimoire/go/internal/build.Version={{.Version}}
  - id: grimoire-mcp
    dir: go
    main: ./cmd/grimoire-mcp
    binary: grimoire-mcp
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/JeremiahM37/grimoire/go/internal/build.Version={{.Version}}

archives:
  # The console and the plugins are served from disk, so an archive without
  # them is a server that starts and shows nothing. GRIMOIRE_WEB_DIR and
  # GRIMOIRE_PLUGIN_DIR point at these.
  #
  # No version in the archive name, so that /releases/latest/download/<name> is
  # a stable URL the README can print and a script can fetch.
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - SECURITY.md
      # Whole directories, not web/**/* — that glob matches only paths with a
      # directory component, so it shipped web/vendor/editor.js and left out
      # index.html and every other top-level file. The archive built, the
      # binary started, and the console answered 404.
      - src: frontend/dist/*.*
        dst: web
        strip_parent: true
      - src: frontend/dist/assets/*
        dst: web/assets
        strip_parent: true
      - src: frontend/dist/vendor/*
        dst: web/vendor
        strip_parent: true
      - plugins

checksum:
  name_template: checksums.txt

nfpms:
  - id: packages
    package_name: grimoire
    vendor: JeremiahM37
    homepage: https://github.com/JeremiahM37/grimoire
    maintainer: JeremiahM37 <JeremiahM37@users.noreply.github.com>
    description: Personal knowledge base and agent memory server; notes as Markdown, RAG, MCP.
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/local/bin
    # The console and the plugins are served from disk; the binary looks in
    # /usr/local/share/grimoire when nothing sits beside it.
    contents:
      - src: frontend/dist/
        dst: /usr/local/share/grimoire/web
      - src: plugins/
        dst: /usr/local/share/grimoire/plugins
      - src: deploy/grimoire.service
        dst: /usr/share/doc/grimoire/grimoire.service
        type: config

homebrew_casks:
  # The cask stages the whole archive, binary beside web/ and plugins/, which
  # is the layout the binary finds on its own (through the bin symlink).
  - name: grimoire
    repository:
      owner: JeremiahM37
      name: homebrew-tap
      branch: main
      git:
        url: git@github.com:JeremiahM37/homebrew-tap.git
        private_key: "{{ .Env.TAP_DEPLOY_KEY }}"
    directory: Casks
    homepage: https://github.com/JeremiahM37/grimoire
    description: Personal knowledge base and agent memory server
    license: MIT
    binaries: [grimoire, grimoire-mcp]
    hooks:
      post:
        install: |
          if system_command("/usr/bin/xattr", args: ["-h"]).exit_status == 0
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/grimoire"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/grimoire-mcp"]
          end
    commit_author:
      name: JeremiahM37
      email: JeremiahM37@users.noreply.github.com
    commit_msg_template: "grimoire {{ .Tag }}"

scoops:
  - name: grimoire
    repository:
      owner: JeremiahM37
      name: scoop-bucket
      branch: main
      git:
        url: git@github.com:JeremiahM37/scoop-bucket.git
        private_key: "{{ .Env.SCOOP_DEPLOY_KEY }}"
    directory: bucket
    homepage: https://github.com/JeremiahM37/grimoire
    description: Personal knowledge base and agent memory server
    license: MIT
    commit_author:
      name: JeremiahM37
      email: JeremiahM37@users.noreply.github.com
    commit_msg_template: "grimoire {{ .Tag }}"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  # The commit log is the changelog: this project writes one commit per
  # decision, with the reasoning in the body.
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: false
  prerelease: auto
  header: |
    ## Install

    ```bash
    curl -fsSL https://raw.githubusercontent.com/JeremiahM37/grimoire/main/install.sh | sh   # Linux, macOS
    brew install JeremiahM37/tap/grimoire                                                   # Homebrew
    scoop bucket add jeremiahm37 https://github.com/JeremiahM37/scoop-bucket && scoop install grimoire   # Windows
    docker run -p 9111:9111 -v grimoire-vault:/vault ghcr.io/jeremiahm37/grimoire:{{ .Version }}
    go install github.com/JeremiahM37/grimoire/go/cmd/grimoire@latest    # the module lives in go/, so @latest resolves the go/{{ .Tag }} tag
    ```

    Windows PowerShell one-liner: `irm https://raw.githubusercontent.com/JeremiahM37/grimoire/main/install.ps1 | iex`.
    Archives (binary beside `web/` and `plugins/`: extract and run), `.deb`, `.rpm` and `checksums.txt` are attached below.
