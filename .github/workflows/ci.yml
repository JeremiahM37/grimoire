name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go/go.sum
      - name: Format
        run: test -z "$(gofmt -l go/)" || { gofmt -l go/; exit 1; }
      - name: Vet
        working-directory: go
        run: go vet ./...
      - name: Tests
        working-directory: go
        run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the server
        working-directory: go
        run: go build -o grimoire ./cmd/grimoire
      - name: Install the harness
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Lint the harness
        run: ruff check tests/ benchmarks/
      - name: Real-browser flows against the built binary
        run: pytest -q tests/e2e
