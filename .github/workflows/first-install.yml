name: First install acceptance
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  fresh-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Browser dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build packaged runtime
        run: docker build -f deploy/Dockerfile -t grimoire:acceptance .
      - name: Authenticated browser, API, MCP and persistence
        run: python tools/test-first-install.py --image grimoire:acceptance
