name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and upload archives
  packages: write   # push the container image to ghcr

jobs:
  binaries:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # goreleaser builds the changelog from history
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go/go.sum
      # A tag that does not build is worse than no tag: the tests run here
      # too, so a release is never the first time this commit was compiled.
      - name: Tests
        working-directory: go
        run: go test ./...
      # Build the archive and check it is a working install BEFORE anything is
      # published. The first v2.0.0 archive shipped a console with no
      # index.html — a glob matched only nested paths — so it built cleanly,
      # started cleanly, and served 404 at /. Nothing in the pipeline was
      # looking at what came out of it.
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=publish --single-target
      - name: The archive must be a working install
        run: |
          set -euo pipefail
          mkdir -p /tmp/relcheck && tar xzf dist/grimoire_linux_amd64.tar.gz -C /tmp/relcheck
          cd /tmp/relcheck
          test -f web/index.html
          GRIMOIRE_VAULT=$PWD/vault GRIMOIRE_PORT=9911 GRIMOIRE_WEB_DIR=$PWD/web \
            GRIMOIRE_PLUGIN_DIR=$PWD/plugins GRIMOIRE_LOCAL_EMBED=off ./grimoire &
          for _ in $(seq 1 30); do curl -sf localhost:9911/api/health >/dev/null && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:9911/)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:9911/app.js)" = 200
          curl -s localhost:9911/api/plugins | grep -q '"name"'
          ./grimoire version
          kill %1

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
